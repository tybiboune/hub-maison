<head>
<meta charset="utf-8">

<title>Accès</title>
<style>
:root{--bg:#EDF0EF;--surface:#fff;--ink:#182427;--muted:#5A6A6E;--line:#D2DADA;--accent:#2E5B71;--on:#fff;--bad:#AF3F2A}
@media (prefers-color-scheme:dark){:root{--bg:#0E1517;--surface:#162023;--ink:#E5EDEE;--muted:#93A3A7;--line:#2A373B;--accent:#82B6CF;--on:#0E1517;--bad:#EC8069;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;display:grid;gap:16px;box-shadow:0 8px 30px rgb(0 0 0 / .08)}
.mark{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--on);display:grid;place-items:center}
h1{margin:0;font-size:1.3rem}p{margin:0;color:var(--muted);font-size:.92rem}
input[type=password]{width:100%;min-height:52px;font-size:1.6rem;letter-spacing:.4em;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.r{display:flex;gap:10px;align-items:center;font-size:.92rem}
label.r input{width:18px;height:18px;accent-color:var(--accent)}
button{min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--on);font-weight:700;font-size:1rem;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
</style>
</head>

<script>
(function(){
"use strict";
var P = JSON.parse(document.getElementById("payload").textContent);
var M = "hub-maison-m";
function u8(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)});}
function b64(a){var s="";new Uint8Array(a).forEach(function(c){s+=String.fromCharCode(c)});return btoa(s);}
var enc = new TextEncoder();
async function masterFromPw(pw){
  var k = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:u8(P.s), iterations:P.n}, k, 256);
}
async function keys(master){
  var h = await crypto.subtle.importKey("raw", master, "HKDF", false, ["deriveKey"]);
  var z = new Uint8Array(0);
  var app = await crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt:z, info:enc.encode("hub-app")}, h, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var sync = await crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt:z, info:enc.encode("hub-sync")}, h, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  return {app:app, sync:sync};
}
async function unlock(master, remember){
  var k = await keys(master);
  var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(P.iv)}, k.app, u8(P.ct));
  try { if (remember) localStorage.setItem(M, b64(master)); } catch(e){}
  var remembered = false; try { remembered = !!localStorage.getItem(M); } catch(e){}
  window.HUB = { syncKey:k.sync, remembered:remembered, lock:function(){ try{localStorage.removeItem(M);}catch(e){} location.reload(); } };
  mount(new TextDecoder().decode(pt));
}
function mount(html){
  var doc = new DOMParser().parseFromString("<!doctype html><html><head></head><body>"+html+"</body></html>", "text/html");
  document.title = (doc.querySelector("title")||{}).textContent || "Hub";
  doc.head.querySelectorAll("link,style,meta").forEach(function(n){ document.head.appendChild(document.importNode(n,true)); });
  document.querySelectorAll("head style").forEach(function(s,i){ if(i===0) s.remove(); });
  document.body.removeAttribute("style");
  document.body.innerHTML = "";
  var scripts = [];
  Array.prototype.slice.call(doc.body.childNodes).forEach(function(n){
    if (n.nodeName === "SCRIPT") { scripts.push(n.textContent); return; }
    if (n.nodeName === "TITLE" || n.nodeName === "LINK" || n.nodeName === "STYLE") { document.head.appendChild(document.importNode(n,true)); return; }
    document.body.appendChild(document.importNode(n,true));
  });
  scripts.forEach(function(code){ var s=document.createElement("script"); s.textContent=code; document.body.appendChild(s); });
}
var f=document.getElementById("f"), pw=document.getElementById("pw"), err=document.getElementById("err"), go=document.getElementById("go");
f.addEventListener("submit", async function(e){
  e.preventDefault(); err.textContent=""; go.disabled=true; go.textContent="Vérification…";
  try { await unlock(await masterFromPw(pw.value), document.getElementById("rem").checked); }
  catch(x){ go.disabled=false; go.textContent="Ouvrir"; err.textContent = (window.crypto && crypto.subtle) ? "Code incorrect." : "Ce navigateur ne permet pas le déchiffrement (ouvre la page en https)."; pw.select(); }
});
var saved=null; try{ saved=localStorage.getItem(M); }catch(e){}
if (saved) { unlock(u8(saved).buffer, true).catch(function(){ try{localStorage.removeItem(M);}catch(e){} pw.focus(); }); } else { pw.focus(); }
})();
</script>
